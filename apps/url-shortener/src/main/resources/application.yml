spring:
  application:
    name: url-shortener
  datasource:
    url: ${URL_DB_JDBC_URL:jdbc:postgresql://localhost:5433/url_shortener}
    username: ${URL_DB_USER:url_shortener}
    password: ${URL_DB_PASSWORD:}
    hikari:
      connection-timeout: ${URL_DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

shortener:
  base-url: ${URL_BASE_URL:http://localhost:8080}
  rate-limit:
    capacity: ${URL_CREATE_RATE_CAPACITY:60}
    window: ${URL_CREATE_RATE_WINDOW:1m}
  analytics:
    enabled: ${URL_ANALYTICS_ENABLED:true}
    max-threads: ${URL_ANALYTICS_MAX_THREADS:2}
    queue-capacity: ${URL_ANALYTICS_QUEUE_CAPACITY:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: ${SERVER_PORT:8080}
