[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "schwab-agentic-orchestrator"
version = "0.1.0"
description = "FastAPI bootstrap for the deterministic SDLC orchestrator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-version = "==0.11.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "strict"
markers = ["integration: requires an explicitly configured PostgreSQL fixture"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
