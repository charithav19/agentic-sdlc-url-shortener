[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "schwab-agentic-orchestrator"
version = "0.1.0"
description = "FastAPI and PostgreSQL foundation for the deterministic SDLC orchestrator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "openai-agents==0.23.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "sqlalchemy[asyncio]==2.1.3",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[project.scripts]
agentic = "app.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"config/default_sdlc.yaml" = "app/resources/default_sdlc.yaml"
"config/policies.yaml" = "app/resources/policies.yaml"
"../../scenarios" = "app/resources/scenarios"

[tool.uv]
required-version = "==0.11.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "strict"
python_classes = ["Test*", "*IT"]
markers = [
    "runner: requires the built isolated Docker engineering runner",
    "integration: requires an explicitly configured PostgreSQL fixture",
    "live: opt-in paid OpenAI API call requiring RUN_LIVE_AGENT_TESTS=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
